openapi: 3.0.3
info:
  title: Adaptive Routing Backend API
  version: 1.0.0
  description: Backend replica API used in adaptive-routing experiments.
servers:
  - url: http://localhost:8081
    description: backend-1 in Docker Compose
paths:
  /api/v1/items:
    post:
      summary: Create an item
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateItemRequest"
      responses:
        "201":
          description: Item created
          headers:
            X-Instance-ID:
              $ref: "#/components/headers/InstanceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SimulatedFailure"
  /api/v1/items/{id}:
    get:
      summary: Get an item by UUID
      operationId: getItemByID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Item found
          headers:
            X-Instance-ID:
              $ref: "#/components/headers/InstanceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/SimulatedFailure"
  /health:
    get:
      summary: Check application and database availability
      operationId: health
      responses:
        "200":
          description: Application and database are available
          headers:
            X-Instance-ID:
              $ref: "#/components/headers/InstanceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Database is unavailable
          headers:
            X-Instance-ID:
              $ref: "#/components/headers/InstanceID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  headers:
    InstanceID:
      description: Identifier of the backend replica that handled the request.
      schema:
        type: string
  schemas:
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: string
          minLength: 1
          maxLength: 5000
    Item:
      type: object
      required: [id, name, value, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        value:
          type: string
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      required: [status, database, instance_id]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        database:
          type: string
          enum: [ok, unavailable]
        instance_id:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Request validation failed
      headers:
        X-Instance-ID:
          $ref: "#/components/headers/InstanceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Item not found
      headers:
        X-Instance-ID:
          $ref: "#/components/headers/InstanceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal server error
      headers:
        X-Instance-ID:
          $ref: "#/components/headers/InstanceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SimulatedFailure:
      description: Artificial failure generated by the simulation middleware
      headers:
        X-Instance-ID:
          $ref: "#/components/headers/InstanceID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
