mode: prod
logging:
  level: INFO
  encoding: json
  development: false
  disableCaller: true
  disableStacktrace: true
  requestIDFieldName: x-request-id
  applicationName: adaptive-routing-backend
listen:
  http:
    isEnabled: true
    host: 0.0.0.0
    port: 8080
    maxRequestProcessingTime: 10s
    readHeaderTimeout: 5s
    readTimeout: 10s
    writeTimeout: 10s
    idleTimeout: 60s
    shutdownTimeout: 10s
infrastructure:
  postgresql:
    rw:
      isEnabled: true
      host: postgres
      port: 5432
      dbName: app
      userName: app
      password: app
      sslMode: disable
      applicationName: adaptive-routing-backend
      connections:
        maxIdleConns: 5
        maxOpenConns: 10
        connMaxLifetime: 30m
        connMaxIdleTime: 5m
      migrations:
        isEnabled: true
        dirPath: /app/migrations
      connectTimeout: 5s
application:
  instanceID: backend-2
  simulation:
    isEnabled: false
    delay: 0s
    errorRate: 0
